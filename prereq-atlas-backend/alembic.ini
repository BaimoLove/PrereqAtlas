# Alembic config. Keep this file ASCII-only: Alembic reads it with the
# locale encoding (GBK on this machine), so non-ASCII comments break it.
# The URL is provided by migrations/env.py from app settings; left empty here.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
