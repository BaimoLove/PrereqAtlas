[project]
name = "prereq-atlas-backend"
version = "0.1.0"
description = "PrereqAtlas —— 面向数据挖掘课程的先修知识图谱与复习路径规划系统后端"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "pymysql>=1.1,<2.0",
    "alembic>=1.13,<2.0",
    "pyjwt>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "networkx>=3.3,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试可 `from fixtures...` 导入共享夹具；`src` 同时加入以支持未安装时的直接运行。
pythonpath = ["src", "tests"]
# 沙箱里 pytest 的缓存目录写入被拒（WinError 5），关闭缓存插件避免噪音。
addopts = "-ra -p no:cacheprovider"
markers = [
    "integration: 需要真实 MySQL 连接的集成测试",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".uv-cache", "migrations/versions", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 注释与文档字符串使用中文，全角标点属正常书写，不做歧义字符检查。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true
warn_unreachable = true
exclude = ["migrations"]
